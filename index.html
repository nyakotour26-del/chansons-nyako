<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Répertoire de Chansons Malgaches</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --music-color: #9b59b6;
            --light-color: #ecf0f1;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: var(--gradient);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            grid-column: 1 / -1;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        header::before {
            content: "🎵";
            position: absolute;
            font-size: 120px;
            opacity: 0.1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .songs-list-section {
            background-color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            height: fit-content;
            max-height: 80vh;
            overflow-y: auto;
            position: sticky;
            top: 20px;
        }
        
        .songs-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light-color);
        }
        
        .songs-list-title {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .songs-count {
            background-color: var(--music-color);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .songs-list {
            list-style: none;
        }
        
        .song-item {
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .song-item::before {
            content: "♪";
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.3;
            transition: all 0.3s ease;
        }
        
        .song-item:hover {
            background-color: white;
            border-left-color: var(--music-color);
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .song-item:hover::before {
            opacity: 0.7;
            transform: translateY(-50%) scale(1.2);
        }
        
        .song-item.active {
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            border-left-color: var(--accent-color);
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }
        
        .song-title {
            font-size: 1em;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--secondary-color);
        }
        
        .song-author {
            font-size: 0.85em;
            color: var(--music-color);
            font-style: italic;
        }
        
        .search-section {
            background-color: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
            grid-column: 2;
        }
        
        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        
        .form-group {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary-color);
        }
        
        input, select, button {
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            width: 100%;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            outline: none;
        }
        
        button {
            background: var(--gradient);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 150px;
            position: relative;
            overflow: hidden;
        }
        
        button::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(50, 50, 93, 0.1), 0 3px 6px rgba(0, 0, 0, 0.08);
        }
        
        button:active::after {
            animation: ripple 1s ease-out;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }
        
        .suggestions-container {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .suggestion-item:hover {
            background-color: var(--light-color);
        }
        
        .suggestion-item.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .suggestion-item:last-child {
            border-bottom: none;
        }
        
        .suggestion-highlight {
            color: var(--accent-color);
            font-weight: bold;
        }
        
        .suggestion-item.active .suggestion-highlight {
            color: white;
        }
        
        .results-section {
            display: none;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            grid-column: 2;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            background: var(--gradient);
            color: white;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-content {
            padding: 25px;
        }
        
        .fiche-item {
            margin-bottom: 40px;
            border: 1px solid #e1e1e1;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        
        .fiche-item:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transform: translateY(-5px);
        }
        
        .fiche-header {
            background: var(--gradient);
            color: white;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .fiche-header::before {
            content: "🎵";
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
        }
        
        .fiche-title {
            color: white;
            font-weight: bold;
            margin-top: 0;
            font-size: 1.8em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            line-height: 1.3;
        }
        
        .author {
            color: #ffeb3b;
            font-weight: 600;
            font-size: 1.1em;
            font-style: italic;
            margin-top: 8px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th {
            text-align: left;
            padding: 18px;
            width: 25%;
            background: var(--light-color);
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
            vertical-align: top;
            white-space: normal;
            word-wrap: break-word;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
        }
        
        .data-table td {
            padding: 18px;
            font-size: 15px;
            color: var(--text-color);
            white-space: pre-wrap;
            border-bottom: 1px solid #ddd;
            background-color: white;
        }
        
        .data-table tr:nth-child(even) td {
            background: #f9f9f9;
        }
        
        .data-table tr:hover td {
            background-color: #f0f7ff;
        }
        
        .data-table img {
            max-width: 95%;
            max-height: 250px;
            display: block;
            margin: 5px auto;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        
        .data-table a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            padding: 8px 15px;
            background-color: #e3f2fd;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .data-table a:hover {
            text-decoration: none;
            background-color: var(--primary-color);
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
        
        .no-results-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            display: none;
            grid-column: 1 / -1;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        .success-message {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .error-message {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .tek-access {
            background: linear-gradient(135deg, #8e44ad, #9b59b6);
            margin-top: 10px;
            width: auto;
        }
        
        .tek-input-container {
            display: none;
            margin-top: 10px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: var(--border-radius);
            border: 1px solid #ddd;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .action-buttons button {
            flex: 1;
            min-width: 150px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .songs-list-section {
                grid-column: 1;
                position: static;
            }
            
            .search-section, .results-section {
                grid-column: 1;
            }
        }
        
        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }
            
            .form-group {
                width: 100%;
            }
            
            .data-table th, .data-table td {
                display: block;
                width: 100%;
            }
            
            .data-table th {
                background: var(--secondary-color);
                color: white;
                margin-top: 10px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Répertoire de Chansons Malgaches</h1>
            <p class="subtitle">Découvrez et explorez notre collection de chansons traditionnelles et contemporaines</p>
        </header>
        
        <section class="songs-list-section" id="songsListSection">
            <div class="songs-list-header">
                <div class="songs-list-title">📜 Liste des Chansons</div>
                <div class="songs-count" id="songsCount">0</div>
            </div>
            <ul class="songs-list" id="songsList">
                <!-- La liste des chansons sera générée ici -->
            </ul>
        </section>
        
        <section class="search-section">
            <form id="searchForm" class="search-form" autocomplete="off">
                <div class="form-group">
                    <label for="searchText">🔍 Rechercher une chanson :</label>
                    <input type="text" id="searchText" placeholder="Titre, auteur, paroles..." autocomplete="off">
                    <div class="suggestions-container" id="suggestionsContainer">
                        <!-- Les suggestions dynamiques apparaîtront ici -->
                    </div>
                </div>
                
                <div class="form-group">
                    <button type="submit">🎶 Rechercher</button>
                </div>
            </form>
            
            <div class="action-buttons">
                <button id="showAllButton" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">
                    📋 Toutes les chansons
                </button>
                
                <button id="tekAccessButton" class="tek-access">
                    🔓 Accès spécial
                </button>
                
                <button id="retryButton" style="background: linear-gradient(135deg, #f39c12, #e67e22); display: none;">
                    🔄 Réessayer
                </button>
            </div>
            
            <div id="tekInputContainer" class="tek-input-container">
                <label for="tekCode">Code d'accès :</label>
                <input type="password" id="tekCode" placeholder="Entrez le code...">
                <button id="submitTekCode" style="margin-top: 10px; width: auto;">Valider</button>
            </div>
        </section>
        
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Chargement des chansons depuis Google Sheets...</p>
        </div>

        <div id="dataInfo" style="display: none;"></div>
        
        <section class="results-section" id="resultsSection">
            <div class="result-header">
                <h2 id="resultTitle">Résultats de la recherche</h2>
                <button id="closeResults">✕ Fermer</button>
            </div>
            <div class="result-content" id="resultContent">
                <!-- Les résultats seront affichés ici -->
            </div>
        </section>
    </div>

    <script>
        // VOTRE LIEN GOOGLE SHEETS
        const GOOGLE_SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXIJyclDLf2asT-FMnmaeWMSPtQHxpAC1wiGJ_xzXbl2StziwiUw9ElW9XyK5yemQ-PHaWlRQbtdHb/pub?gid=602871919&single=true&output=csv';
        
        let sheetData = [];
        let headers = [];
        let allSongTitles = [];
        let columnsWithData = [];
        let showRohinityColumn = false; // Colonne cachée par défaut
        let rohinityColumnIndex = -1;
        let songTitleColumnIndex = -1; // Index de la colonne LOHATENY
        let authorColumnIndex = -1; // Index de la colonne MPANORATRA
        
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchText');
            const suggestionsContainer = document.getElementById('suggestionsContainer');
            
            document.getElementById('searchForm').addEventListener('submit', handleSearch);
            document.getElementById('showAllButton').addEventListener('click', showAllData);
            document.getElementById('closeResults').addEventListener('click', closeResults);
            document.getElementById('retryButton').addEventListener('click', loadDataFromGoogleSheets);
            
            // Gestion de l'accès TEK
            document.getElementById('tekAccessButton').addEventListener('click', toggleTekInput);
            document.getElementById('submitTekCode').addEventListener('click', validateTekCode);
            
            searchInput.setAttribute('autocomplete', 'off');
            searchInput.setAttribute('autocorrect', 'off');
            searchInput.setAttribute('autocapitalize', 'off');
            searchInput.setAttribute('spellcheck', 'false');
            
            searchInput.addEventListener('input', function() {
                showSuggestions(this.value);
            });
            
            searchInput.addEventListener('focus', function() {
                if (this.value) {
                    showSuggestions(this.value);
                }
            });
            
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateSuggestions(e.key);
                }
                
                if (e.key === 'Enter' && suggestionsContainer.style.display === 'block') {
                    e.preventDefault();
                    selectActiveSuggestion();
                }
            });
            
            document.addEventListener('click', function(e) {
                if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
                    suggestionsContainer.style.display = 'none';
                }
            });
            
            loadDataFromGoogleSheets();
        });
        
        function toggleTekInput() {
            const tekInputContainer = document.getElementById('tekInputContainer');
            tekInputContainer.style.display = tekInputContainer.style.display === 'none' ? 'block' : 'none';
        }
        
        function validateTekCode() {
            const tekCode = document.getElementById('tekCode').value;
            if (tekCode === 'tek') {
                showRohinityColumn = true;
                document.getElementById('tekInputContainer').style.display = 'none';
                document.getElementById('tekCode').value = '';
                
                // Afficher un message de succès
                const dataInfo = document.getElementById('dataInfo');
                dataInfo.innerHTML = `
                    <div class="success-message">
                        ✅ Accès spécial activé - Colonne "Rohin'ity hira ity" maintenant visible
                    </div>
                `;
                dataInfo.style.display = 'block';
                
                // Si des résultats sont déjà affichés, les mettre à jour
                if (document.getElementById('resultsSection').style.display === 'block') {
                    const currentSearch = document.getElementById('searchText').value;
                    if (currentSearch) {
                        const results = searchData(currentSearch);
                        displayResults(results, `Résultats pour "${currentSearch}"`);
                    } else {
                        displayResults(sheetData, 'Toutes les chansons');
                    }
                }
            } else {
                alert('Code incorrect. Veuillez réessayer.');
            }
        }
        
        function navigateSuggestions(key) {
            const suggestions = document.querySelectorAll('.suggestion-item');
            const activeSuggestion = document.querySelector('.suggestion-item.active');
            
            if (suggestions.length === 0) return;
            
            let nextIndex = 0;
            
            if (activeSuggestion) {
                const currentIndex = Array.from(suggestions).indexOf(activeSuggestion);
                if (key === 'ArrowDown') {
                    nextIndex = (currentIndex + 1) % suggestions.length;
                } else if (key === 'ArrowUp') {
                    nextIndex = (currentIndex - 1 + suggestions.length) % suggestions.length;
                }
                
                activeSuggestion.classList.remove('active');
            }
            
            suggestions[nextIndex].classList.add('active');
            suggestions[nextIndex].scrollIntoView({ block: 'nearest' });
        }
        
        function selectActiveSuggestion() {
            const activeSuggestion = document.querySelector('.suggestion-item.active');
            if (activeSuggestion) {
                document.getElementById('searchText').value = activeSuggestion.getAttribute('data-value');
                document.getElementById('suggestionsContainer').style.display = 'none';
                handleSearch(new Event('submit'));
            }
        }
        
        async function loadDataFromGoogleSheets() {
            console.log('🔍 Début du chargement des données...');
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('retryButton').style.display = 'none';
            clearErrorMessages();
            
            try {
                console.log('🔄 Essai 1: Accès direct...');
                let response = await fetch(GOOGLE_SHEETS_URL);
                
                if (response.ok) {
                    const csvText = await response.text();
                    console.log('✅ Succès avec accès direct');
                    processCSVData(csvText);
                    return;
                }
                throw new Error(`Direct failed: ${response.status}`);
                
            } catch (error1) {
                console.log('❌ Échec accès direct:', error1.message);
                
                try {
                    console.log('🔄 Essai 2: AllOrigins...');
                    const proxyUrl = 'https://api.allorigins.win/raw?url=';
                    let response = await fetch(proxyUrl + encodeURIComponent(GOOGLE_SHEETS_URL));
                    
                    if (response.ok) {
                        const csvText = await response.text();
                        console.log('✅ Succès avec AllOrigins');
                        processCSVData(csvText);
                        return;
                    }
                    throw new Error(`AllOrigins failed: ${response.status}`);
                    
                } catch (error2) {
                    console.log('❌ Échec AllOrigins:', error2.message);
                    showError('Impossible de charger les données. Vérifiez votre connexion internet.');
                }
            }
        }

        function parseCSVWithNewlines(csvText) {
            console.log('🔄 Parsing CSV avec gestion des retours à la ligne...');
            
            const lines = [];
            let currentLine = [];
            let currentField = '';
            let inQuotes = false;
            let quoteChar = '"';
            
            for (let i = 0; i < csvText.length; i++) {
                const char = csvText[i];
                const nextChar = csvText[i + 1];
                
                if (char === quoteChar) {
                    if (inQuotes && nextChar === quoteChar) {
                        currentField += quoteChar;
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentLine.push(currentField);
                    currentField = '';
                } else if (char === '\n' && !inQuotes) {
                    currentLine.push(currentField);
                    lines.push(currentLine);
                    currentLine = [];
                    currentField = '';
                } else if (char === '\r') {
                    if (nextChar === '\n' && !inQuotes) {
                        currentLine.push(currentField);
                        lines.push(currentLine);
                        currentLine = [];
                        currentField = '';
                        i++;
                    }
                } else {
                    currentField += char;
                }
            }
            
            if (currentField !== '' || currentLine.length > 0) {
                currentLine.push(currentField);
                lines.push(currentLine);
            }
            
            console.log(`✅ Parsing terminé: ${lines.length} lignes détectées`);
            
            let newlineCount = 0;
            lines.forEach(line => {
                line.forEach(field => {
                    if (field.includes('\n')) {
                        newlineCount += field.split('\n').length - 1;
                    }
                });
            });
            console.log(`📊 ${newlineCount} retours à la ligne DANS les cellules (conservés)`);
            
            return lines;
        }
        
        function processCSVData(csvText) {
            try {
                console.log('📄 Traitement des données CSV...');
                
                if (!csvText || csvText.trim().length === 0) {
                    throw new Error('Le fichier CSV est vide');
                }
                
                const lines = parseCSVWithNewlines(csvText);
                
                if (!lines || lines.length === 0) {
                    throw new Error('Aucune donnée parsée');
                }
                
                headers = lines[0] || [];
                console.log('🏷️ En-têtes détectés:', headers.length, 'colonnes');
                
                // Trouver l'index de la colonne "Rohin'ity hira ity"
                rohinityColumnIndex = headers.findIndex(header => 
                    header && typeof header === 'string' && 
                    header.toLowerCase().includes("rohin'ity hira ity")
                );
                
                if (rohinityColumnIndex === -1) {
                    // Essayer une autre orthographe
                    rohinityColumnIndex = headers.findIndex(header => 
                        header && typeof header === 'string' && 
                        header.toLowerCase().includes("rohinity")
                    );
                }
                
                // Trouver l'index de la colonne "LOHATENY"
                songTitleColumnIndex = headers.findIndex(header => 
                    header && typeof header === 'string' && 
                    header.toLowerCase().includes("lohateny")
                );
                
                // Trouver l'index de la colonne "MPANORATRA"
                authorColumnIndex = headers.findIndex(header => 
                    header && typeof header === 'string' && 
                    header.toLowerCase().includes("mpanoratra")
                );
                
                console.log('🔍 Index de la colonne Rohin\'ity hira ity:', rohinityColumnIndex);
                console.log('🔍 Index de la colonne LOHATENY:', songTitleColumnIndex);
                console.log('🔍 Index de la colonne MPANORATRA:', authorColumnIndex);
                
                sheetData = lines.slice(1).filter(row => 
                    row && row.some(cell => cell && cell.trim() !== '')
                );
                
                console.log('📈 Données extraites:', sheetData.length, 'chansons');
                
                if (sheetData.length === 0) {
                    throw new Error('Aucune chanson avec des données trouvée');
                }
                
                normalizeData();
                detectColumnsWithData();
                prepareSongTitles();
                populateSongsList();
                
                showDataInfo();
                
            } catch (error) {
                console.error('❌ Erreur de traitement:', error);
                showError(error.message);
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }
        
        function prepareSongTitles() {
            allSongTitles = sheetData
                .map(row => row[songTitleColumnIndex] || '')
                .filter(value => value && value.trim() !== '')
                .map(value => value.trim());
            
            console.log('💡 Titres de chansons chargés:', allSongTitles.length);
        }
        
        function populateSongsList() {
            const songsList = document.getElementById('songsList');
            const songsCount = document.getElementById('songsCount');
            
            songsList.innerHTML = '';
            
            sheetData.forEach((row, index) => {
                const songTitle = row[songTitleColumnIndex] || `Chanson ${index + 1}`;
                const author = row[authorColumnIndex] || '';
                
                const listItem = document.createElement('li');
                listItem.className = 'song-item';
                listItem.dataset.index = index;
                listItem.innerHTML = `
                    <div class="song-title">${songTitle}</div>
                    ${author ? `<div class="song-author">${author}</div>` : ''}
                `;
                
                listItem.addEventListener('click', function() {
                    // Retirer la classe active de tous les éléments
                    document.querySelectorAll('.song-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    
                    // Ajouter la classe active à l'élément cliqué
                    this.classList.add('active');
                    
                    // Afficher la fiche correspondante
                    displaySingleSong(index);
                });
                
                songsList.appendChild(listItem);
            });
            
            songsCount.textContent = sheetData.length;
        }
        
        function displaySingleSong(index) {
            const songData = sheetData[index];
            const resultsSection = document.getElementById('resultsSection');
            const resultContent = document.getElementById('resultContent');
            const resultTitle = document.getElementById('resultTitle');
            
            // Recalculer les colonnes avec données (au cas où l'accès TEK a changé)
            detectColumnsWithData();
            
            const songTitle = songData[songTitleColumnIndex] || `Chanson ${index + 1}`;
            const author = songData[authorColumnIndex] || '';
            
            let html = `
                <div class="fiche-item">
                    <div class="fiche-header">
                        <h2>🎵 Fiche de la Chanson</h2>
                        <h3 class="fiche-title">
                            ${songTitle}
                            ${author ? `<div class="author">${author}</div>` : ''}
                        </h3>
                    </div>
                    <div style="padding: 0;">
                        <table class="data-table">
            `;
            
            for (let colIndex of columnsWithData) {
                const header = headers[colIndex] || `Colonne ${colIndex + 1}`;
                const value = songData[colIndex] || '';
                
                if (value !== undefined && value !== null && value !== '' && value.trim() !== '') {
                    html += `
                        <tr>
                            <th>${header}</th>
                            <td>${formatCellValue(value)}</td>
                        </tr>
                    `;
                }
            }
            
            html += `
                        </table>
                    </div>
                </div>
            `;
            
            resultContent.innerHTML = html;
            resultTitle.textContent = `Fiche: ${songTitle}`;
            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }
        
        function normalizeData() {
            let maxColumns = headers.length;
            sheetData.forEach(row => {
                if (row.length > maxColumns) {
                    maxColumns = row.length;
                }
            });
            
            while (headers.length < maxColumns) {
                headers.push(`Colonne ${headers.length + 1}`);
            }
            
            sheetData.forEach(row => {
                while (row.length < maxColumns) {
                    row.push('');
                }
                if (row.length > maxColumns) {
                    row.length = maxColumns;
                }
            });
            
            console.log(`📐 Données normalisées: ${maxColumns} colonnes`);
        }
        
        function detectColumnsWithData() {
            columnsWithData = [];
            
            for (let colIndex = 0; colIndex < headers.length; colIndex++) {
                // Exclure la colonne Rohin'ity hira ity si l'accès n'est pas activé
                if (colIndex === rohinityColumnIndex && !showRohinityColumn) {
                    continue;
                }
                
                let hasData = false;
                
                for (let rowIndex = 0; rowIndex < sheetData.length; rowIndex++) {
                    const value = sheetData[rowIndex][colIndex];
                    if (value !== undefined && value !== null && value !== '' && value.trim() !== '') {
                        hasData = true;
                        break;
                    }
                }
                
                if (hasData) {
                    columnsWithData.push(colIndex);
                }
            }
            
            console.log(`🎯 ${columnsWithData.length} colonnes avec données sur ${headers.length} colonnes totales`);
        }
        
        // FONCTION POUR SUPPRIMER LES ACCENTS
        function removeAccents(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }
        
        function findMatchingSongTitles(searchTerm) {
            const lowerSearchTerm = searchTerm.toLowerCase();
            const searchWithoutAccents = removeAccents(lowerSearchTerm);
            const matchingTitles = [];
            
            sheetData.forEach((row, index) => {
                const songTitle = row[songTitleColumnIndex] || '';
                
                if (songTitle && songTitle.trim() !== '') {
                    const hasMatchInAnyColumn = row.some(cell => {
                        const cellValue = String(cell).toLowerCase();
                        const cellWithoutAccents = removeAccents(cellValue);
                        
                        return cellValue.includes(lowerSearchTerm) || 
                               cellWithoutAccents.includes(searchWithoutAccents);
                    });
                    
                    if (hasMatchInAnyColumn) {
                        matchingTitles.push(songTitle.trim());
                    }
                }
            });
            
            return [...new Set(matchingTitles)];
        }
        
        function showSuggestions(searchTerm) {
            const suggestionsContainer = document.getElementById('suggestionsContainer');
            
            if (!searchTerm || searchTerm.length < 2) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            const matchingTitles = findMatchingSongTitles(searchTerm);
            
            if (matchingTitles.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }
            
            const suggestionsToShow = matchingTitles.slice(0, 10);
            
            suggestionsContainer.innerHTML = suggestionsToShow
                .map(title => {
                    const lowerTitle = title.toLowerCase();
                    const lowerSearchTerm = searchTerm.toLowerCase();
                    const startIndex = lowerTitle.indexOf(lowerSearchTerm);
                    
                    if (startIndex !== -1) {
                        const endIndex = startIndex + searchTerm.length;
                        const before = title.substring(0, startIndex);
                        const match = title.substring(startIndex, endIndex);
                        const after = title.substring(endIndex);
                        
                        return `
                            <div class="suggestion-item" data-value="${title}">
                                🎵 ${before}<span class="suggestion-highlight">${match}</span>${after}
                            </div>
                        `;
                    } else {
                        return `
                            <div class="suggestion-item" data-value="${title}">
                                🎵 ${title} <small style="color: #7f8c8d; font-style: italic;">(correspondance dans le contenu)</small>
                            </div>
                        `;
                    }
                })
                .join('');
            
            suggestionsContainer.style.display = 'block';
            
            document.querySelectorAll('.suggestion-item').forEach((item, index) => {
                item.addEventListener('click', function() {
                    document.getElementById('searchText').value = this.getAttribute('data-value');
                    suggestionsContainer.style.display = 'none';
                    handleSearch(new Event('submit'));
                });
                
                if (index === 0) {
                    item.classList.add('active');
                }
            });
        }
        
        function showDataInfo() {
            const dataInfo = document.getElementById('dataInfo');
            let infoMessage = `✅ ${sheetData.length} chanson(s) chargée(s) avec succès !
                    <br><small>${headers.length} colonnes - ${columnsWithData.length} avec données</small>
                    <br><small>🎶 Recherche intuitive activée</small>`;
            
            if (rohinityColumnIndex !== -1 && !showRohinityColumn) {
                infoMessage += `<br><small>🔒 Colonne spéciale cachée - Utilisez l'accès spécial</small>`;
            }
            
            dataInfo.innerHTML = `<div class="success-message">${infoMessage}</div>`;
            dataInfo.style.display = 'block';
        }
        
        function showError(message) {
            const searchSection = document.querySelector('.search-section');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `
                <strong>❌ Erreur de chargement:</strong> ${message}
                <br><small>Vérifiez votre connexion internet et que le Google Sheet est public</small>
            `;
            searchSection.appendChild(errorDiv);
            
            document.getElementById('retryButton').style.display = 'block';
        }
        
        function clearErrorMessages() {
            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(msg => msg.remove());
        }
        
        function handleSearch(event) {
            if (event) event.preventDefault();
            
            const searchValue = document.getElementById('searchText').value.trim();
            
            if (!searchValue) {
                alert('Veuillez entrer un mot-clé pour la recherche');
                return;
            }
            
            if (sheetData.length === 0) {
                alert('Aucune donnée chargée');
                return;
            }
            
            const results = searchData(searchValue);
            displayResults(results, `Résultats pour "${searchValue}"`);
            
            document.getElementById('suggestionsContainer').style.display = 'none';
        }
        
        function showAllData() {
            if (sheetData.length === 0) {
                alert('Aucune donnée chargée');
                return;
            }
            
            displayResults(sheetData, 'Toutes les chansons');
        }
        
        // RECHERCHE SANS ACCENTS - NOUVELLE VERSION
        function searchData(searchValue) {
            const lowerSearch = searchValue.toLowerCase();
            const searchWithoutAccents = removeAccents(lowerSearch);
            
            return sheetData.filter(row => {
                return row.some(cell => {
                    const cellValue = String(cell).toLowerCase();
                    const cellWithoutAccents = removeAccents(cellValue);
                    
                    return cellValue.includes(lowerSearch) || 
                           cellWithoutAccents.includes(searchWithoutAccents);
                });
            });
        }
        
        function displayResults(results, title) {
            const resultsSection = document.getElementById('resultsSection');
            const resultContent = document.getElementById('resultContent');
            const resultTitle = document.getElementById('resultTitle');
            
            // Recalculer les colonnes avec données (au cas où l'accès TEK a changé)
            detectColumnsWithData();
            
            if (results.length === 0) {
                resultContent.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🎵</div>
                        <h3>Aucune chanson trouvée</h3>
                        <p>Essayez avec d'autres mots-clés ou consultez la liste complète</p>
                    </div>
                `;
            } else {
                let html = `
                    <div style="margin-bottom: 20px; padding: 15px; background: #ecf0f1; border-radius: 5px;">
                        <strong>${results.length} chanson(s) trouvée(s)</strong>
                        ${showRohinityColumn ? '<br><small>✅ Colonne spéciale "Rohin\'ity hira ity" visible</small>' : ''}
                    </div>
                `;
                
                results.forEach((row, index) => {
                    const numeroData = sheetData.findIndex(r => r === row) + 1;
                    const titreColB = row[songTitleColumnIndex] || `Chanson ${numeroData}`;
                    const author = row[authorColumnIndex] || '';
                    
                    html += `
                        <div class="fiche-item">
                            <div class="fiche-header">
                                <h2>🎵 Fiche de la Chanson</h2>
                                <h3 class="fiche-title">
                                    ${titreColB}
                                    ${author ? `<div class="author">${author}</div>` : ''}
                                </h3>
                            </div>
                            <div style="padding: 0;">
                                <table class="data-table">
                    `;
                    
                    for (let colIndex of columnsWithData) {
                        const header = headers[colIndex] || `Colonne ${colIndex + 1}`;
                        const value = row[colIndex] || '';
                        
                        if (value !== undefined && value !== null && value !== '' && value.trim() !== '') {
                            html += `
                                <tr>
                                    <th>${header}</th>
                                    <td>${formatCellValue(value)}</td>
                                </tr>
                            `;
                        }
                    }
                    
                    html += `
                                </table>
                            </div>
                        </div>
                    `;
                });
                
                resultContent.innerHTML = html;
            }
            
            resultTitle.textContent = title;
            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }
        
        function formatCellValue(value) {
            const strValue = String(value);
            
            if (strValue.startsWith('http') && strValue.match(/\.(jpeg|jpg|png|gif|webp|bmp)/i)) {
                return `<img src="${strValue}" alt="Image" onerror="this.style.display='none'">`;
            }
            
            if (strValue.startsWith('http')) {
                return `<a href="${strValue}" target="_blank">🔗 Ouvrir le lien</a>`;
            }
            
            return `<div style="font-size:15px; font-weight:500; white-space:pre-wrap; line-height:1.8; font-family: inherit;">${strValue}</div>`;
        }
        
        function closeResults() {
            document.getElementById('resultsSection').style.display = 'none';
        }
    </script>
</body>
</html>
